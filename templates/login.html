<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHG-Secure – Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* ========================================================= */
        /* EXACT FIRST PHOTO LOGIN PAGE COLOR PALETTE & SCROLLING    */
        /* ========================================================= */
        
        html {
            background-color: #000000 !important;
            background: #000000 !important;
            min-height: 100% !important;
            height: auto !important;
            overflow-y: auto !important;
            overflow-x: hidden !important;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif !important;
            background-color: #000000 !important;
            background: #000000 !important;
            background-image: none !important;
            color: #F8FAFC !important;
            margin: 0 !important;
            padding: 0 !important;
            min-height: 100% !important;
            height: auto !important;
            overflow-y: auto !important;
            overflow-x: hidden !important;
            display: flex !important;
            flex-direction: column !important;
        }

        /* 1. White/Off-White Top Header */
        .login-header-bar {
            background-color: #FAFAF7 !important;
            background: #FAFAF7 !important;
            border-bottom: 1px solid #E2E8F0 !important;
            flex-shrink: 0 !important;
            position: sticky !important;
            top: 0 !important;
            z-index: 40 !important;
        }

        .login-header-title {
            color: #000000 !important;
        }

        .login-status-dot {
            background-color: #10B981 !important;
        }

        .login-status-text {
            color: #10B981 !important;
        }

        /* Main Scrollable Content Container */
        .login-main-container {
            flex: 1 0 auto !important;
            height: auto !important;
            max-height: none !important;
            overflow: visible !important;
            display: flex !important;
            flex-direction: column !important;
            align-items: center !important;
            justify-content: flex-start !important;
            width: 100% !important;
            box-sizing: border-box !important;
            padding: 1.5rem 1rem 4rem 1rem !important;
        }

        /* 3. Pure Black Login Card */
        .login-card-box {
            background-color: #000000 !important;
            background: #000000 !important;
            border: 1px solid #1E293B !important;
            width: 100% !important;
            max-width: 28rem !important;
            box-sizing: border-box !important;
            margin: 1rem auto 2rem auto !important;
        }

        /* Shield container */
        .login-icon-box {
            background-color: rgba(37, 99, 235, 0.15) !important;
            border: 1px solid rgba(59, 130, 246, 0.3) !important;
        }

        /* 4. White Title */
        .login-heading {
            color: #FFFFFF !important;
        }

        /* 5. Subtitle & Labels */
        .login-subheading,
        .login-field-label {
            color: #94A3B8 !important;
        }

        /* 6. White Input Boxes with Dark Text */
        .login-input-field {
            background-color: #FFFFFF !important;
            background: #FFFFFF !important;
            color: #111111 !important;
            border: 1px solid #E5E7EB !important;
            font-weight: 600 !important;
        }

        .login-input-field:focus {
            border-color: #E87545 !important;
            outline: none !important;
        }

        .login-input-field::placeholder {
            color: #9CA3AF !important;
        }

        /* 7. Forgot PIN */
        .login-forgot-btn {
            color: #60A5FA !important;
        }

        /* 8. Orange Login Button */
        .login-btn-primary {
            background-color: #E87545 !important;
            background: #E87545 !important;
            color: #FFFFFF !important;
        }

        .login-btn-primary:hover {
            background-color: #D66434 !important;
            background: #D66434 !important;
        }

        /* Demo credentials container */
        .login-demo-panel {
            background-color: #0F172A !important;
            background: #0F172A !important;
            border: 1px solid #1E293B !important;
        }

        .login-demo-card {
            background-color: #1E293B !important;
            background: #1E293B !important;
            border: 1px solid #334155 !important;
        }

        .login-demo-card:hover {
            background-color: #334155 !important;
            background: #334155 !important;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body class="min-h-screen text-slate-100 flex flex-col justify-start items-center select-none relative box-border" style="background-color: #000000 !important; background: #000000 !important; background-image: none !important; min-height: 100%; height: auto; overflow-y: auto; overflow-x: hidden;">

    <!-- 1. Top Header: White/Off-White with Black Text -->
    <header class="w-full login-header-bar px-6 py-3.5 flex justify-between items-center z-20 shrink-0 box-border" style="background-color: #FAFAF7 !important; border-bottom: 1px solid #E2E8F0 !important;">
        <div class="flex items-center gap-2">
            <span class="text-xl">🛡️</span>
            <span class="font-black login-header-title text-base tracking-wider uppercase" style="color: #000000 !important;">SHG-SECURE</span>
        </div>
        <div class="flex items-center gap-2">
            <span class="w-2.5 h-2.5 rounded-full login-status-dot animate-pulse" style="background-color: #10B981 !important;"></span>
            <span class="text-xs font-bold login-status-text uppercase tracking-widest" style="color: #10B981 !important;">SYSTEM SECURE</span>
        </div>
    </header>

    <!-- Main Content Area: Fully Vertically Scrollable with Native Page Scrollbar -->
    <main class="login-main-container">
        <!-- 3. Pure Black Login Card -->
        <div class="login-card-box rounded-3xl p-6 sm:p-8 shadow-2xl space-y-5 backdrop-blur-xl" style="background-color: #000000 !important; border: 1px solid #1E293B !important;">
            <!-- Logo and Title -->
            <div class="text-center space-y-1.5">
                <div class="inline-flex items-center justify-center w-12 h-12 login-icon-box rounded-2xl mb-1 text-2xl shadow-inner" style="background-color: rgba(37, 99, 235, 0.15) !important; border: 1px solid rgba(59, 130, 246, 0.3) !important;">
                    🛡️
                </div>
                <!-- 4. White Title -->
                <h1 class="text-2xl font-black login-heading tracking-wider uppercase" style="color: #FFFFFF !important;">SHG-SECURE</h1>
                <!-- 5. Subtitle -->
                <p class="text-[11px] font-semibold login-subheading tracking-wide uppercase" style="color: #94A3B8 !important;">Financial Transparency for Every Member</p>
            </div>

            <!-- Login Form -->
            <form id="login-form" action="/login" method="POST" onsubmit="return validateForm();" class="space-y-4 pt-1">
                {% if error %}
                <!-- Error message (Shown ONLY when Flask returns an error on failed POST) -->
                <div id="login-error-msg" class="p-3 bg-red-950/80 border border-red-500/50 rounded-xl text-red-200 text-xs font-bold text-center">
                    {{ error }}
                </div>
                {% endif %}

                <div id="js-error-msg" class="hidden p-3 bg-red-950/80 border border-red-500/50 rounded-xl text-red-200 text-xs font-bold text-center">
                </div>

                <!-- 6. Member ID Input (White Background, Dark Text) -->
                <div class="space-y-1.5 text-left">
                    <label class="text-[11px] font-bold login-field-label uppercase tracking-wider block" style="color: #94A3B8 !important;">Member ID or Username</label>
                    <input type="text" name="member_id" id="login-member-id" placeholder="e.g. SHG001-M01 or lakshmi" required value="SHG001-M01"
                        class="w-full login-input-field text-sm rounded-xl p-3 focus:outline-none transition font-mono tracking-wide font-semibold" 
                        style="background-color: #FFFFFF !important; color: #111111 !important; border: 1px solid #E5E7EB !important;" />
                </div>

                <!-- PIN / Password Input (White Background, Dark Text) -->
                <div class="space-y-1.5 text-left">
                    <div class="flex justify-between items-center">
                        <label class="text-[11px] font-bold login-field-label uppercase tracking-wider" style="color: #94A3B8 !important;">PIN / Password</label>
                        <!-- 7. Bright Blue Forgot PIN -->
                        <button type="button" onclick="alert('Demo PIN: 1234');" class="text-[11px] login-forgot-btn hover:underline font-medium" style="color: #60A5FA !important;">Forgot PIN?</button>
                    </div>
                    <input type="password" name="pin" id="login-pin" placeholder="••••" required value="1234"
                        class="w-full login-input-field text-sm rounded-xl p-3 focus:outline-none transition font-mono tracking-widest font-semibold" 
                        style="background-color: #FFFFFF !important; color: #111111 !important; border: 1px solid #E5E7EB !important;" />
                </div>

                <!-- 8. Orange Submit Button -->
                <button type="submit" id="login-submit-btn" class="w-full mt-2 login-btn-primary font-extrabold text-sm py-3.5 rounded-xl transition shadow-lg uppercase tracking-wider flex items-center justify-center gap-2 cursor-pointer" style="background-color: #E87545 !important; color: #FFFFFF !important;">
                    🔒 LOGIN
                </button>
            </form>

            <!-- Demo Helper Panel -->
            <div class="pt-3 border-t" style="border-top: 1px solid #1E293B !important;">
                <div class="login-demo-panel rounded-2xl p-3.5 text-left space-y-2.5" style="background-color: #0F172A !important; border: 1px solid #1E293B !important;">
                    <div class="flex justify-between items-center">
                        <span class="text-[11px] font-extrabold text-amber-400 uppercase tracking-wider flex items-center gap-1">
                            💡 DEMO CREDENTIALS
                        </span>
                        <span class="text-[10px] font-bold uppercase tracking-wider px-2 py-0.5 rounded-full" style="color: #94A3B8 !important; background-color: #1E293B !important; border: 1px solid #334155 !important;">Working PIN: 1234</span>
                    </div>
                    
                    <div class="grid grid-cols-2 gap-2 text-xs">
                        <!-- Member Quick Button -->
                        <button type="button" onclick="fillDemo('SHG001-M01');" 
                            class="p-2.5 login-demo-card rounded-xl text-left transition cursor-pointer group" style="background-color: #1E293B !important; border: 1px solid rgba(16, 185, 129, 0.5) !important;">
                            <div class="text-[10px] uppercase font-bold flex justify-between" style="color: #94A3B8 !important;">
                                <span style="color: #10B981 !important;">Member (Lakshmi)</span>
                                <span class="group-hover:underline" style="color: #10B981 !important;">Use</span>
                            </div>
                            <div class="font-mono text-[11px] font-bold" style="color: #FFFFFF !important;">SHG001-M01</div>
                            <div class="text-[10px]" style="color: #10B981 !important;">PIN: 1234</div>
                        </button>

                        <!-- Leader Quick Button -->
                        <button type="button" onclick="fillDemo('SHG001-M03');" 
                            class="p-2.5 login-demo-card rounded-xl text-left transition cursor-pointer group" style="background-color: #1E293B !important; border: 1px solid #334155 !important;">
                            <div class="text-[10px] uppercase font-bold flex justify-between" style="color: #94A3B8 !important;">
                                <span style="color: #60A5FA !important;">Leader (Sujatha)</span>
                                <span class="group-hover:underline" style="color: #60A5FA !important;">Use</span>
                            </div>
                            <div class="font-mono text-[11px] font-bold" style="color: #FFFFFF !important;">SHG001-M03</div>
                            <div class="text-[10px]" style="color: #10B981 !important;">PIN: 1234</div>
                        </button>

                        <!-- Reviewer Quick Button -->
                        <button type="button" onclick="fillDemo('reviewer');" 
                            class="p-2.5 login-demo-card rounded-xl text-left transition cursor-pointer group" style="background-color: #1E293B !important; border: 1px solid #334155 !important;">
                            <div class="text-[10px] uppercase font-bold flex justify-between" style="color: #94A3B8 !important;">
                                <span style="color: #A5B4FC !important;">Bank Reviewer</span>
                                <span class="group-hover:underline" style="color: #A5B4FC !important;">Use</span>
                            </div>
                            <div class="font-mono text-[11px] font-bold" style="color: #FFFFFF !important;">reviewer</div>
                            <div class="text-[10px]" style="color: #10B981 !important;">PIN: 1234</div>
                        </button>

                        <!-- Admin Quick Button -->
                        <button type="button" onclick="fillDemo('admin');" 
                            class="p-2.5 login-demo-card rounded-xl text-left transition cursor-pointer group" style="background-color: #1E293B !important; border: 1px solid #334155 !important;">
                            <div class="text-[10px] uppercase font-bold flex justify-between" style="color: #94A3B8 !important;">
                                <span style="color: #FBBF24 !important;">Admin</span>
                                <span class="group-hover:underline" style="color: #FBBF24 !important;">Use</span>
                            </div>
                            <div class="font-mono text-[11px] font-bold" style="color: #FFFFFF !important;">admin</div>
                            <div class="text-[10px]" style="color: #10B981 !important;">PIN: 1234</div>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        function fillDemo(identifier) {
            document.getElementById('login-member-id').value = identifier;
            document.getElementById('login-pin').value = '1234';
            const jsErr = document.getElementById('js-error-msg');
            if (jsErr) jsErr.classList.add('hidden');
        }

        function validateForm() {
            const memberId = document.getElementById('login-member-id').value.trim();
            const pin = document.getElementById('login-pin').value.trim();
            const jsErr = document.getElementById('js-error-msg');

            if (!memberId) {
                if (jsErr) {
                    jsErr.innerText = "Please enter your Member ID or Username.";
                    jsErr.classList.remove('hidden');
                }
                return false;
            }
            if (!pin) {
                if (jsErr) {
                    jsErr.innerText = "Please enter your PIN.";
                    jsErr.classList.remove('hidden');
                }
                return false;
            }
            return true;
        }
    </script>
</body>
</html>
